[package]
name = "maze"
version = "0.0.1"
edition = "2024"
license = "MIT"

[lib]
name = "maze"
path = "src/lib.rs"

[[bin]]
name = "maze"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4.43", features = ["clock"] }
clap = { version = "4.5.56", features = ["derive"] }

[dev-dependencies]
proptest = { version = "1.9", default-features = false, features = ["std"] }
criterion = "0.8"

[[bench]]
name = "generation"
harness = false
