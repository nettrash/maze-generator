# The version every developer and CI is expected to build with.
#
# Pinning it here rather than only in the workflow means `cargo` resolves the
# same toolchain from anywhere in the tree, so a lint or a borrow-check rule
# that differs between versions shows up on the first local build instead of
# in a red CI run. rustup walks up from the current directory to find this
# file, which is why it sits at the root and not in `app/`: the image build
# copies `app/` on its own and should keep using the `rust:1.100.0-slim` base.
#
# Keep this in step with the base image in the Dockerfile. The workflow reads
# the channel out of this file, so CI cannot drift from it.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy", "rust-analyzer"]
